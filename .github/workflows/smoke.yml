name: smoke

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validators:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test
      - run: npm run validate-tasks
      - run: npm run leakage
      - run: npm run bench:smoke
